---
- name: Docker  ----  Ubuntu ----  Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"

- name: Docker  ----  Ubuntu ----  Remove stale apt_repository sources file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when: ansible_facts['os_family'] == "Debian"

- name: Docker  ----  Ubuntu ----  Add apt repository (OS-codename {{ codename }})
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ codename }}"]
    components: [stable]
    signed_by: /etc/apt/keyrings/docker.asc
    install_python_debian: true
    state: present
    mode: '0644'
  vars:
    codename: "{{ ansible_facts['distribution_release'] }}"
    # codename: noble # No official support for Ubuntu 25.04 yet - https://docs.docker.com/engine/install/ubuntu/#os-requirements
  when: ansible_facts['os_family'] == "Debian"
