---
## force: true works around the npm module's unreliable idempotency check for global
## packages, which otherwise re-attempts the install and fails with EEXIST on the bin symlink.
- name: Node  ----  Modules AI  ----  Install Node.js applications
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
    force: true
  environment:
    HOME: "/home/{{ default_user }}"
    NPM_CONFIG_PREFIX: "/home/{{ default_user }}/.local"
    PATH: "/home/{{ default_user }}/.local/bin:{{ ansible_env.PATH }}"
  loop:
    - "@google/gemini-cli"
    - "@github/copilot"

## npm writes the installed bin symlinks/scripts using the ambient umask, which can
## leave them group-writable (0770) - force 0755 so a compromised group member can't
## tamper with these executables.
- name: Node  ----  Modules AI  ----  Enforce non-group-writable permissions on installed CLI binaries
  ansible.builtin.file:
    path: "/home/{{ default_user }}/.local/bin/{{ item }}"
    state: file
    mode: '0755'
  loop:
    - gemini
    - copilot
