---
- name: Packages Desktop  ----  Ubuntu  ----  Chromium
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: Packages Desktop  ----  Ubuntu  ----  Chromium  ----  Install
      ansible.builtin.apt:
        pkg:
          - chromium-browser
          - chromium-browser-l10n
          - chromium-codecs-ffmpeg
        state: latest
        update_cache: true

- name: Packages Desktop  ----  Arch  ----  Chromium
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    - name: Packages Desktop  ----  Arch  ----  Chromium  ----  Install
      community.general.pacman:
        pkg:
          - chromium
        state: latest
        update_cache: true
