---
- name: Packages Desktop  ----  Ubuntu  ----  Uninstall
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: Packages Desktop  ----  Ubuntu  ----  Uninstall  ----  Pre-installed packages
      ansible.builtin.apt:
        pkg:
          - thunderbird
          - libreoffice
          - libreoffice-*
          - totem
          - totem-*
        state: absent
        purge: true

    - name: Packages Desktop  ----  Ubuntu  ----  Uninstall  ----  Other packages
      ansible.builtin.apt:
        pkg:
          - asciidoctor
          - yarn
          - google-chrome-stable
          - 7zip-rar
          - asunder
        state: absent
        purge: true

    - name: Packages Desktop  ----  Ubuntu  ----  Uninstall  ----  Pre-installed snap packages
      community.general.snap:
        name:
          - thunderbird
        state: absent
      when: not is_test | default(false)

    - name: Packages Desktop  ----  Ubuntu  ----  Uninstall  ----  Dev Tools
      community.general.snap:
        name:
          - intellij-idea-ultimate
          - intellij-idea-community
          - balena-etcher
          - postman
        state: absent
      when: not is_test | default(false)

- name: Packages Desktop  ----  Arch  ----  Uninstall
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    # Omarchy preinstalls these via its base package list and its own package
    # repository (see docs/omarchy-workstation-role-matrix.md and
    # /usr/share/omarchy/install/omarchy-base.packages); purged so an Arch/Omarchy
    # workstation ends up without this bundled software. discord has an official
    # Arch package but is not preinstalled - purged defensively in case it was
    # ever installed, same treatment as the other apps here.
    - name: Packages Desktop  ----  Arch  ----  Uninstall  ----  Other packages
      community.general.pacman:
        name:
          - aether
          - brasero
          - cliamp
          - discord
          - kdenlive
          - libreoffice-fresh
          - localsend
          - moonlight-qt
          - obs-studio
          - obsidian
          - pinta
          - xournalpp
        state: absent

    # Basecamp, HEY and Zoom have no Arch package at all, and Discord's default
    # Omarchy launcher is a web app too - all four ship as desktop entries
    # wrapping a URL (~/.local/share/applications/<Name>.desktop), not packages.
    - name: Packages Desktop  ----  Arch  ----  Uninstall  ----  Pre-installed web apps
      ansible.builtin.file:
        path: "/home/{{ default_user }}/.local/share/applications/{{ item }}.desktop"
        state: absent
      loop:
        - Discord
        - Basecamp
        - HEY
        - Zoom

    # Of all the apps removed above, only Obsidian, the cliamp Music TUI, and HEY's
    # Email/New email/Calendar shortcuts have a default Omarchy keybinding - unbind
    # them so the shortcuts do not point at removed apps. See `omarchy menu
    # keybindings --print` and /usr/share/omarchy/default/hypr/bindings/applications.lua.
    # Only present on actual Omarchy hosts (not vanilla Arch/test containers), so
    # check for it first instead of forcing blockinfile to create it.
    - name: Packages Desktop  ----  Arch  ----  Uninstall  ----  Check for Omarchy keybindings file
      ansible.builtin.stat:
        path: "/home/{{ default_user }}/.config/hypr/bindings.lua"
      register: packages_desktop_arch_omarchy_bindings_file

    - name: Packages Desktop  ----  Arch  ----  Uninstall  ----  Remove keybindings for uninstalled apps
      ansible.builtin.blockinfile:
        dest: "/home/{{ default_user }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK - unbind uninstalled app keybindings"
        block: |
          hl.unbind("SUPER + SHIFT + O")
          hl.unbind("SUPER + SHIFT + ALT + M")
          hl.unbind("SUPER + SHIFT + E")
          hl.unbind("SUPER + SHIFT + ALT + E")
          hl.unbind("SUPER + SHIFT + C")
      when: packages_desktop_arch_omarchy_bindings_file.stat.exists
