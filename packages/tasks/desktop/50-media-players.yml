---
- name: Packages Desktop  ----  Ubuntu  ----  Media Players
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: Packages Desktop  ----  Ubuntu  ----  Media Players  ----  Players and DRM packages
      ansible.builtin.apt:
        pkg:
          - vlc
          - vlc-plugin-access-extra
          - libbluray-bdj
          - libdvdcss2
          - vlc-plugin-fluidsynth
          - vlc-plugin-jack
          - ffmpeg
          - libavcodec-extra
          - ubuntu-restricted-extras
        state: latest
        update_cache: true

    - name: Packages Desktop  ----  Ubuntu  ----  Media Players  ----  Audio CD ripper
      ansible.builtin.apt:
        pkg:
          - lame
          - vorbis-tools
          - flac
          - libopus0
          - wavpack
        state: latest
        update_cache: true

    - name: Packages Desktop  ----  Ubuntu  ----  Media Players  ----  CD/DVD writer
      ansible.builtin.apt:
        pkg:
          - brasero
          - gstreamer1.0-plugins-ugly
        state: latest
        update_cache: true

    - name: Packages Desktop  ----  Ubuntu  ----  Media Players  ----  Spotify
      community.general.snap:
        name:
          - spotify
        state: present
      when: not is_test | default(false)

- name: Packages Desktop  ----  Arch  ----  Media Players
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    - name: Packages Desktop  ----  Arch  ----  Media Players  ----  Players and DRM packages
      community.general.pacman:
        pkg:
          - vlc
          - ffmpeg
          - libbluray
          - libdvdcss
        state: latest
        update_cache: true

    - name: Packages Desktop  ----  Arch  ----  Media Players  ----  Audio CD ripper
      community.general.pacman:
        pkg:
          - lame
          - vorbis-tools
          - flac
          - wavpack
        state: latest
        update_cache: true

    - name: Packages Desktop  ----  Arch  ----  Media Players  ----  CD/DVD writer
      community.general.pacman:
        pkg:
          - brasero
        state: latest
        update_cache: true

    # Spotify has no official package on vanilla Arch - this only resolves on Omarchy,
    # which configures its own package repository (OPR) for it. Skipped in test/CI
    # the same way the Ubuntu snap install is, since neither is exercised there.
    - name: Packages Desktop  ----  Arch  ----  Media Players  ----  Spotify
      community.general.pacman:
        pkg:
          - spotify
        state: present
        update_cache: true
      when: not is_test | default(false)
