---
- name: Packages Desktop  ----  Ubuntu  ----  Dev Tools
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: Packages Desktop  ----  Ubuntu  ----  Dev Tools  ---- Install
      ansible.builtin.apt:
        pkg: &packages
          - filezilla
          - rpi-imager
        state: latest
        update_cache: true

- name: Packages Desktop  ----  Arch  ----  Dev Tools
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    - name: Packages Desktop  ----  Arch  ----  Dev Tools  ---- Install
      community.general.pacman:
        name: *packages
        state: present
        update_cache: true
