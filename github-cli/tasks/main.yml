---
- name: GitHub CLI  ----  Ubuntu
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: GitHub CLI  ----  Ubuntu  ----  Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: GitHub CLI  ----  Ubuntu  ----  Download GPG key
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: '0644'

    - name: GitHub CLI  ----  Ubuntu  ----  Remove stale apt_repository sources file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/github-cli.list
        state: absent

    - name: GitHub CLI  ----  Ubuntu  ----  Add apt repository
      ansible.builtin.deb822_repository:
        name: github-cli
        types: [deb]
        uris: https://cli.github.com/packages
        suites: [stable]
        components: [main]
        signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        install_python_debian: true
        state: present
        mode: '0644'

    - name: GitHub CLI  ----  Ubuntu  ----  Install
      ansible.builtin.apt:
        name: gh
        state: latest
        update_cache: true

- name: GitHub CLI  ----  Arch
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    - name: GitHub CLI  ----  Arch  ----  Install
      community.general.pacman:
        pkg:
          - github-cli
        state: latest
        update_cache: true

- name: GitHub CLI  ----  Verify installation
  ansible.builtin.command: gh --version
  register: ghcli_version_output
  changed_when: false

- name: GitHub CLI  ----  Print version
  ansible.builtin.debug:
    msg: "{{ ghcli_version_output.stdout }}"
