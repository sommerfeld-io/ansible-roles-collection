---
- name: Git  ----  Install package (Ubuntu/Debian)
  ansible.builtin.apt:
    pkg: &packages
      - git
    state: &state latest
    update_cache: &update true
  when: ansible_facts['os_family'] == "Debian"

- name: Git  ----  Install package (Arch)
  community.general.pacman:
    name: *packages
    state: *state
    update_cache: *update
  when: ansible_facts['os_family'] == "Archlinux"
  # state: latest against Arch's rolling-release repos can genuinely report changed a second
  # time if a newer build lands between two nearby runs - not a logic bug, so excluded from
  # Molecule's idempotence check.
  tags: [molecule-idempotence-notest]

- name: Git  ----  Copy git configuration
  ansible.builtin.copy:
    src: ../files/.gitconfig
    dest: "/home/{{ default_user }}/.gitconfig"
    owner: "{{ default_user }}"
    group: "{{ default_user }}"
    mode: u=rw,g=r,o=

- name: Git  ----  Config  ----  Write aliases to .bashrc
  ansible.builtin.lineinfile:
    create: true
    mode: u=rw,g=,o=
    dest: "/home/{{ default_user }}/.bashrc"
    owner: "{{ default_user }}"
    group: "{{ default_user }}"
    line: "{{ item }}"
    state: present
  loop:
    - alias pull-all-repos="git all pull"
