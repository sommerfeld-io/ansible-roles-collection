---
- name: Virtualization  ----  Vagrant  ----  Ubuntu
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Download HashiCorp GPG key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /tmp/hashicorp-archive-keyring.gpg.asc
        mode: '0644'

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Convert GPG key to binary format
      ansible.builtin.shell: |
        gpg --dearmor -o /etc/apt/keyrings/hashicorp-archive-keyring.gpg < /tmp/hashicorp-archive-keyring.gpg.asc
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/hashicorp-archive-keyring.gpg

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Set keyring file permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
        mode: '0644'

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Remove stale apt_repository sources file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/hashicorp.list
        state: absent

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Add apt repository
      ansible.builtin.deb822_repository:
        name: hashicorp
        types: [deb]
        uris: https://apt.releases.hashicorp.com
        suites: ["{{ codename }}"]
        components: [main]
        signed_by: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
        install_python_debian: true
        state: present
        mode: '0644'
      vars:
        ## HashiCorp supports only LTS releases
        ## So 25.04 (plucky), 25.10 (questing), and 26.04 (resolute) are mapped to 24.04 LTS (noble)
        ## TODO: Revisit this when HashiCorp adds support for resolute (26.04 LTS)
        codename: >-
          {% if ansible_distribution_version.startswith('25.') or ansible_distribution_version.startswith('26.') -%}
          noble{%- elif ansible_distribution_release == 'noble' -%}
          noble{%- else -%}
          {{ ansible_facts['distribution_release'] }}{%- endif %}

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Install Vagrant packages
      ansible.builtin.apt:
        pkg:
          - vagrant
        state: latest
        update_cache: true

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Install Vagrant plugins
      ansible.builtin.shell: |
        vagrant plugin install vagrant-cachier
        # vagrant plugin install vagrant-vbguest
        # vagrant plugin install vagrant-docker-compose
      become: true
      become_user: "{{ default_user }}"
      args:
        executable: /bin/bash

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Verify installation
      ansible.builtin.command: vagrant --version
      register: virtualization_vagrant_version_output
      changed_when: false

    - name: Virtualization  ----  Vagrant  ----  Ubuntu ---- Print version
      ansible.builtin.debug:
        msg: "{{ virtualization_vagrant_version_output.stdout }}"

- name: Virtualization  ----  Vagrant  ----  Arch
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    ## Vagrant has no official Arch Linux package - it is AUR-only, installed via yay,
    ## which Omarchy ships by default. This is a deliberate exception to this collection's
    ## usual no-AUR-helper policy, same treatment as visual-studio-code-bin in the vscode role.
    - name: Virtualization  ----  Vagrant  ----  Arch ---- Check if vagrant is installed
      ansible.builtin.command: pacman -Qi vagrant
      register: virtualization_vagrant_arch_installed
      changed_when: false
      failed_when: false

    - name: Virtualization  ----  Vagrant  ----  Arch ---- Install
      when: virtualization_vagrant_arch_installed.rc | default(1) != 0
      block:

        ## yay drops privileges for the AUR build itself, but internally shells out to its
        ## own `sudo pacman -U ...` to install the finished package. That nested sudo call
        ## is invisible to Ansible (no tty, no way to feed it a password), so it fails with
        ## "sudo: timed out reading password" unless default_user already has passwordless
        ## sudo for pacman. Grant that here, scoped to pacman only, and revoke it again in
        ## `always` below - regardless of whether the install succeeds or fails.
        - name: Virtualization  ----  Vagrant  ----  Arch ---- Grant temporary passwordless sudo for pacman
          community.general.sudoers:
            name: "{{ default_user }}-vagrant-pacman"
            state: present
            user: "{{ default_user }}"
            commands: /usr/bin/pacman
            nopassword: true

        - name: Virtualization  ----  Vagrant  ----  Arch ---- Install vagrant
          ansible.builtin.command:
            cmd: yay -S --noconfirm --needed vagrant
          become: true
          become_user: "{{ default_user }}"

      always:

        - name: Virtualization  ----  Vagrant  ----  Arch ---- Revoke temporary passwordless sudo for pacman
          community.general.sudoers:
            name: "{{ default_user }}-vagrant-pacman"
            state: absent

    - name: Virtualization  ----  Vagrant  ----  Arch ---- Install Vagrant plugins
      ansible.builtin.shell: |
        vagrant plugin install vagrant-cachier
        # vagrant plugin install vagrant-vbguest
        # vagrant plugin install vagrant-docker-compose
      become: true
      become_user: "{{ default_user }}"
      args:
        executable: /bin/bash

    - name: Virtualization  ----  Vagrant  ----  Arch ---- Verify installation
      ansible.builtin.command: vagrant --version
      register: virtualization_vagrant_version_output
      changed_when: false

    - name: Virtualization  ----  Vagrant  ----  Arch ---- Print version
      ansible.builtin.debug:
        msg: "{{ virtualization_vagrant_version_output.stdout }}"
