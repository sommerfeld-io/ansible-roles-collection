---
## Without blacklisting the KVM kernel modules, Virtualbox will not work properly
## because they conflict with each other. This does not affect Docker because it uses
## containers and not full VMs.
- name: Virtualization  ----  Config  ----  Blacklist the KVM kernel modules
  when: ansible_facts['os_family'] in ["Debian", "Archlinux"]
  ansible.builtin.lineinfile:
    create: true
    mode: u=rw,g=r,o=r
    dest: "/etc/modprobe.d/blacklist-kvm.conf"
    owner: "root"
    group: "root"
    line: "{{ item }}"
    state: present
  with_items:
    - blacklist kvm
    - blacklist kvm_intel
    - blacklist kvm_amd

- name: Virtualization  ----  Virtualbox Setup  ----  Ubuntu
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: Virtualization  ----  Virtualbox ---- Install Virtualbox and dependencies
      ansible.builtin.apt:
        pkg:
          - virtualbox
          - virtualbox-qt
          - virtualbox-dkms
        state: latest
        update_cache: true

- name: Virtualization  ----  Virtualbox Setup  ----  Arch
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    ## virtualbox-host-dkms (DKMS sources) is used instead of the precompiled
    ## virtualbox-host-modules-arch, which only targets the stock `linux` kernel package
    ## and is therefore not resolvable/compatible on installs running a different kernel
    ## (e.g. linux-lts, linux-zen, or a distro-specific kernel like Omarchy's). DKMS builds
    ## against whatever kernel headers are installed, so it works regardless of kernel choice
    ## and keeps working across kernel upgrades without waiting for a new precompiled build.
    - name: Virtualization  ----  Virtualbox ---- Install Virtualbox and dependencies
      community.general.pacman:
        pkg:
          - virtualbox
          - virtualbox-host-dkms
          - linux-headers
        state: latest
        update_cache: true

- name: Virtualization  ----  Virtualbox Setup
  when: ansible_facts['os_family'] in ["Debian", "Archlinux"]
  block:

    - name: Virtualization  ----  Virtualbox ---- Create virtual machines folder
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rwx,g=rx,o=
      with_items:
        - "{{ virtualization_vm_folder }}"

    - name: Virtualization  ----  Virtualbox ---- Set virtual machines folder
      ansible.builtin.command: "vboxmanage setproperty machinefolder {{ virtualization_vm_folder }}"
      become: true
      become_user: "{{ default_user }}"

    - name: Virtualization  ----  Virtualbox ---- Add user to group
      ansible.builtin.user:
        name: "{{ default_user }}"
        shell: /bin/bash
        groups: vboxusers
        append: true
