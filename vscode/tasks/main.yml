---
- name: VSCode  ----  Ubuntu
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: VSCode  ----  Ubuntu  ----  Install
      community.general.snap:
        name:
          - code
        state: present
        classic: true
      when: not is_test | default(false)

- name: VSCode  ----  Arch
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    ## Code - OSS (official Arch repos) is replaced by Microsoft's own build below, so it
    ## must be removed first - both packages provide a /usr/bin/code binary and would
    ## otherwise conflict.
    - name: VSCode  ----  Arch  ----  Uninstall Code - OSS
      community.general.pacman:
        name:
          - code
        state: absent

    ## visual-studio-code-bin is AUR-only (the real Microsoft build, required to pass the
    ## Dev Containers extension's build check and use the Microsoft Marketplace) - install
    ## via yay, which Omarchy ships by default. This is a deliberate exception to this
    ## collection's usual no-AUR-helper policy, see docs/omarchy-workstation-role-matrix.md.
    ## AUR builds must not run as root, hence become_user. Skipped in test/CI the same way
    ## other Omarchy-only installs are, since yay is not available there.
    - name: VSCode  ----  Arch  ----  Check if visual-studio-code-bin is installed
      ansible.builtin.command: pacman -Qi visual-studio-code-bin
      register: vscode_arch_bin_installed
      changed_when: false
      failed_when: false
      when: not is_test | default(false)

    - name: VSCode  ----  Arch  ----  Install visual-studio-code-bin
      when:
        - not is_test | default(false)
        - vscode_arch_bin_installed.rc | default(1) != 0
      block:

        ## yay drops privileges for the AUR build itself, but internally shells out to its
        ## own `sudo pacman -U ...` to install the finished package. That nested sudo call
        ## is invisible to Ansible (no tty, no way to feed it a password), so it fails with
        ## "sudo: timed out reading password" unless default_user already has passwordless
        ## sudo for pacman. Grant that here, scoped to pacman only, and revoke it again in
        ## `always` below - regardless of whether the install succeeds or fails.
        - name: VSCode  ----  Arch  ----  Grant temporary passwordless sudo for pacman
          community.general.sudoers:
            name: "{{ default_user }}-vscode-pacman"
            state: present
            user: "{{ default_user }}"
            commands: /usr/bin/pacman
            nopassword: true

        - name: VSCode  ----  Arch  ----  Install
          ansible.builtin.command:
            cmd: yay -S --noconfirm --needed visual-studio-code-bin
          become: true
          become_user: "{{ default_user }}"

      always:

        - name: VSCode  ----  Arch  ----  Revoke temporary passwordless sudo for pacman
          community.general.sudoers:
            name: "{{ default_user }}-vscode-pacman"
            state: absent

- name: VSCode  ----  Snippets
  ansible.builtin.import_tasks: 10-snippets.yml
