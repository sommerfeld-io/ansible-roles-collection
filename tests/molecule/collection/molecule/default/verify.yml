---
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    default_user: molecule
  tasks:
    - name: Hardening  ----  Check UMASK was hardened in /etc/login.defs
      ansible.builtin.command: grep -q '^UMASK 027' /etc/login.defs
      changed_when: false

    - name: Bash  ----  Check ll alias was added to .bashrc
      ansible.builtin.command: grep -q 'alias ll="ls -alFh --color=auto"' /home/{{ default_user }}/.bashrc
      changed_when: false

    - name: Bash  ----  Check SSH keypair was generated
      ansible.builtin.stat:
        path: /home/{{ default_user }}/.ssh/id_rsa.pub
      register: ssh_pubkey

    - name: Bash  ----  Assert SSH keypair exists
      ansible.builtin.assert:
        that: ssh_pubkey.stat.exists

    - name: Filesystem  ----  Check timezone was set
      ansible.builtin.command: grep -q 'Europe/Berlin' /etc/timezone
      changed_when: false

    - name: Filesystem  ----  Check autostart directory exists
      ansible.builtin.stat:
        path: /home/{{ default_user }}/.config/autostart
      register: autostart_dir

    - name: Filesystem  ----  Assert autostart directory exists
      ansible.builtin.assert:
        that: autostart_dir.stat.exists and autostart_dir.stat.isdir

    - name: Git  ----  Check gitconfig was copied
      ansible.builtin.command: grep -q 'helper = cache --timeout=3600' /home/{{ default_user }}/.gitconfig
      changed_when: false

    - name: Packages  ----  Check jq (main) was installed
      ansible.builtin.command: jq --version
      changed_when: false

    - name: Cron  ----  Check cron.d exists
      ansible.builtin.stat:
        path: /etc/cron.d
      register: cron_d

    - name: Cron  ----  Assert cron.d exists
      ansible.builtin.assert:
        that: cron_d.stat.exists and cron_d.stat.isdir

    - name: Taskfile-dev  ----  Check task was installed
      ansible.builtin.command: task --version
      changed_when: false

    - name: Ansible  ----  Check ansible was installed
      ansible.builtin.command: ansible --version
      changed_when: false

    - name: Conky  ----  Check host.conkyrc was copied
      ansible.builtin.stat:
        path: /home/{{ default_user }}/.config/conky/host.conkyrc
      register: conkyrc

    - name: Conky  ----  Assert host.conkyrc exists
      ansible.builtin.assert:
        that: conkyrc.stat.exists

    - name: Github-cli  ----  Check gh was installed
      ansible.builtin.command: gh --version
      changed_when: false

    - name: Kubectl  ----  Check kubectl was installed
      ansible.builtin.command: kubectl version --client
      changed_when: false

    - name: Helm  ----  Check helm was installed
      ansible.builtin.command: helm version
      changed_when: false

    - name: Atuin  ----  Check atuin binary was installed
      ansible.builtin.stat:
        path: /home/{{ default_user }}/.atuin/bin/atuin
      register: atuin_bin

    - name: Atuin  ----  Assert atuin binary exists and is executable
      ansible.builtin.assert:
        that: atuin_bin.stat.exists and atuin_bin.stat.executable

    - name: Docker  ----  Check docker-scout plugin was installed
      ansible.builtin.stat:
        path: /home/{{ default_user }}/.docker/cli-plugins/docker-scout
      register: docker_scout

    - name: Docker  ----  Assert docker-scout plugin exists
      ansible.builtin.assert:
        that: docker_scout.stat.exists
